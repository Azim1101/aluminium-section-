import java.util.Properties

plugins { id 'com.android.application' }

/*
 * Release signing is deliberately kept outside version control.
 * Local builds read signing.properties; GitHub Actions reads the same values
 * from repository secrets. This makes every release use one permanent key.
 */
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("signing.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { stream -> signingProperties.load(stream) }
}

def signingValue = { String key ->
    def environmentValue = System.getenv(key)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) return environmentValue
    return signingProperties.getProperty(key)
}

def releaseStorePath = signingValue("ALU_KEYSTORE_FILE")
def releaseStorePassword = signingValue("ALU_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("ALU_KEY_ALIAS")
def releaseKeyPassword = signingValue("ALU_KEY_PASSWORD")
def releaseSigningReady = releaseStorePath && releaseStorePassword && releaseKeyAlias
        && releaseKeyPassword && rootProject.file(releaseStorePath).exists()

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}
if (releaseTaskRequested && !releaseSigningReady) {
    throw new GradleException("Release signing is not configured. Add signing.properties locally "
            + "or set ALU_KEYSTORE_FILE, ALU_KEYSTORE_PASSWORD, ALU_KEY_ALIAS and ALU_KEY_PASSWORD.")
}

android {
    namespace 'com.digitalalu.alu'
    compileSdk 35

    defaultConfig {
        applicationId "com.digitalalu.alu"
        // v1.1: minSdk 21 -> 24 — LiteRT-LM (FunctionGemma runtime) requires API 24.
        // Android 7.0 (2016) ab minimum; Android 5/6 devices <1% hain.
        minSdk 24
        targetSdk 35
        // v1.0 — nayi generation: version numbering fresh 1.0 se shuru
        // (purani line 2.x/3.x/4.x-test thi; ye production v3.0.0 ka successor hai)
        // 1.0.1 — mobile-app-ux-auditor skill ke fixes (accessibility labels)
        // 1.1.0 — FunctionGemma 270M on-device tool-calling tier (REAL runtime,
        //         LiteRT-LM bundled; minSdk 24)
        versionCode 3
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Real devices only: arm64 (MNN + LiteRT-LM) and armv7 (MNN-only fallback).
        // LiteRT-LM ka x86_64 lib (26 MB, sirf emulator ke liye) APK se hata deta hai.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { viewBinding true }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// 2 GB sandbox: keep the forked test JVM small so the Gradle daemon
// (Xmx 900m) and the test worker never OOM the machine together.
tasks.withType(Test).configureEach {
    maxHeapSize = "384m"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // v1.1: FunctionGemma 270M on-device tool-calling runtime (Google AI Edge)
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (the android.jar stub can't parse).
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
