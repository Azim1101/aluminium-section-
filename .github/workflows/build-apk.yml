name: Build & Release APK

# Har push par APK build hota hai + GitHub Release banta hai.
# Actions tab se manually bhi chala sakte hain (workflow_dispatch).

on:
  push:
    branches:
      - arena/019fcd63-aluminium-section
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (debug + release)
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs with version name
        run: |
          VER=$(grep -oE 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "ALU-Window-v${VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "ALU-Window-v${VER}-release.apk"
          ls -lh ALU-Window-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALU-Window-APK-build-${{ github.run_number }}
          path: ALU-Window-*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: ALU Window v${{ env.APP_VERSION }} — Build ${{ github.run_number }}
          body: |
            Auto-built from commit `${{ github.sha }}`

            **Install:** `ALU-Window-v${{ env.APP_VERSION }}-release.apk` download karke phone mein install karein.
          files: ALU-Window-*.apk
          make_latest: true
