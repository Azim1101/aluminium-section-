name: Build & Release APK

# Har push par APK build hota hai + GitHub Release banta hai.
# Actions tab se manually bhi chala sakte hain (workflow_dispatch).
# Note: sabhi actions full commit SHA se pinned hain (repo security policy).

on:
  push:
    branches:
      - Main/aluminium-section
      - arena/019fcd63-aluminium-section
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: '8.7'

      # One permanent key is restored on every runner. Do not replace these
      # secrets, otherwise Android will require users to uninstall the old app.
      - name: Restore permanent release signing key
        env:
          ALU_KEYSTORE_BASE64: ${{ secrets.ALU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ALU_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ALU_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$ALU_KEYSTORE_BASE64" | base64 --decode > signing/alu-window-release.jks
          test -s signing/alu-window-release.jks

      - name: Build APK (debug + release)
        env:
          ALU_KEYSTORE_FILE: signing/alu-window-release.jks
          ALU_KEYSTORE_PASSWORD: ${{ secrets.ALU_KEYSTORE_PASSWORD }}
          ALU_KEY_ALIAS: ${{ secrets.ALU_KEY_ALIAS }}
          ALU_KEY_PASSWORD: ${{ secrets.ALU_KEY_PASSWORD }}
        run: |
          [ -n "$ALU_KEYSTORE_PASSWORD" ] || { echo "::error::Missing ALU_KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$ALU_KEY_ALIAS" ] || { echo "::error::Missing ALU_KEY_ALIAS secret"; exit 1; }
          [ -n "$ALU_KEY_PASSWORD" ] || { echo "::error::Missing ALU_KEY_PASSWORD secret"; exit 1; }
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs with version name
        run: |
          VER=$(grep -oE 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "ALU-Window-v${VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "ALU-Window-v${VER}-release.apk"
          ls -lh ALU-Window-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ALU-Window-APK-build-${{ github.run_number }}
          path: ALU-Window-*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: ALU Window v${{ env.APP_VERSION }} — Build ${{ github.run_number }}
          body: |
            Auto-built from commit `${{ github.sha }}`

            **Install:** `ALU-Window-v${{ env.APP_VERSION }}-release.apk` download karke phone mein install karein.
          files: ALU-Window-*.apk
          make_latest: true
